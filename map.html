<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bohol Map · Tan-aw Bohol</title>
<meta name="description" content="Interactive map of Bohol's tourist and heritage spots with distances, rain chance, your location and 360° walk-throughs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
</head>
<body class="map-page">
<nav class="top">
  <a class="brand" href="index.html"><img class="nlogo" src="images/logo.svg" alt=""><span>Tan-aw Bohol</span></a>
  <div class="links"><a href="index.html">Home</a><a href="index.html#places">Places</a></div>
  <a class="back" href="index.html">← Back</a>
</nav>
<div id="rain-banner" class="banner" role="status" hidden></div>

<main class="wrap">
  <div class="mapbox">
    <div id="map" role="region" aria-label="Map of Bohol with tourist spots. Click a pin for details."></div>
    <div id="backdrop" class="backdrop" hidden></div>
    <div id="detail" class="drawer" role="dialog" aria-label="Spot details" hidden></div>
    <div id="route-bar" class="route-bar" role="status" hidden></div>
    <button id="search-toggle" class="search-toggle" type="button">Search spots</button>
  </div>
  <aside id="tools" class="tools card" hidden>
    <button id="tools-close" class="x-small" type="button" aria-label="Close search">&times;</button>
    <input id="search" type="search" placeholder="Search spots…" aria-label="Search spots">
    <h3 class="list-title">Spots <span id="count"></span></h3>
    <ul id="list" class="list"></ul>
  </aside>
</main>

<div id="pano" class="pano" role="dialog" aria-modal="true" aria-labelledby="pano-title" hidden>
  <div class="pano-bar">
    <strong id="pano-title"></strong>
    <button id="pano-close" class="btn" type="button" aria-label="Close walk-through">✕ Close</button>
  </div>
  <div id="pano-view"></div>
  <div id="pano-readout" class="readout" aria-hidden="true"></div>
</div>

<div id="toast" class="toast" role="alert" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script type="module" src="js/map.js"></script>
</body>
</html>
